<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YunX Fetch</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <img class="logo" src="icons/icon32.png" alt="" />
    <div class="brand">
      <div class="title">YunX Fetch</div>
      <div class="status" id="status">
        <span class="dot"></span><span id="status-text">检测中…</span>
      </div>
    </div>
    <div class="tools">
      <button type="button" class="icon-btn" id="open-folder" title="打开下载文件夹" aria-label="打开下载文件夹">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
      </button>
      <button type="button" class="icon-btn" id="open-settings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.14.6.67 1 1.29 1H21a2 2 0 1 1 0 4h-.09c-.62 0-1.15.4-1.29 1z" />
        </svg>
      </button>
      <button type="button" class="icon-btn" id="refresh" title="刷新资源列表" aria-label="刷新" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <path d="M21 3v6h-6" />
        </svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="downloads" role="tab" aria-selected="true">
      下载中心<span class="tab-badge" id="task-count" hidden>0</span>
    </button>
    <button type="button" class="tab" data-tab="resources" role="tab" aria-selected="false">
      资源嗅探<span class="tab-badge" id="res-count" hidden>0</span>
    </button>
  </nav>

  <section class="pane" id="pane-downloads">
    <div class="dl-bar">
      <span class="dl-summary" id="dl-summary">正在读取任务…</span>
      <span class="dl-speed" id="dl-speed"></span>
    </div>
    <div class="t-list" id="task-list"></div>
  </section>

  <section class="pane" id="pane-resources" hidden>
    <section class="cd-banner" id="cd-banner" hidden>
      <div class="cd-text">
        <div class="cd-title">已停止捕获此网站的下载</div>
        <div class="cd-sub">还有 <b class="cd-time" id="cd-time">0 分 00 秒</b> 自动重新开始捕获</div>
      </div>
      <button type="button" class="cd-btn" id="cd-resume">立即重新开始</button>
    </section>

    <section class="vcard-card" id="video-card" hidden>
      <div class="vcard-head">
        <span class="vcard-badge" id="vcard-badge"></span>
        <span class="vcard-id" id="vcard-id"></span>
      </div>
      <div class="vcard-title" id="vcard-title">正在读取视频信息…</div>
      <div class="vcard-fields" id="vcard-fields">
        <label class="vcard-field">
          <span class="vcard-label">清晰度</span>
          <select class="vcard-select" id="video-quality"></select>
        </label>
        <label class="vcard-field">
          <span class="vcard-label">下载方式</span>
          <select class="vcard-select" id="video-mode">
            <option value="merge">普通下载（音视频合并）</option>
            <option value="video">仅视频</option>
            <option value="audio">仅音频</option>
            <option value="separate">视频＋音频（不合并）</option>
          </select>
        </label>
      </div>
      <button type="button" class="vcard-btn" id="video-download">交给 YunX 下载</button>
      <div class="vcard-hint" id="video-hint"></div>
    </section>

    <section class="list-head">
      <span class="list-title">当前页面资源</span>
      <span class="count" id="count">0</span>
    </section>

    <div class="filters" id="filters" hidden></div>

    <div class="list" id="list">
      <div class="empty">
        <div class="empty-title">暂无嗅探到的资源</div>
        <div class="empty-sub">播放视频或点击页面上的下载按钮后再试</div>
      </div>
    </div>
  </section>

  <footer class="foot">
    <span id="hint">任务与设置只保存在本机，不上传任何数据。</span>
    <button type="button" class="text-btn" id="open-manager-2">下载中心</button>
  </footer>

  <div class="preview" id="preview" hidden>
    <div class="preview-bar">
      <span class="preview-name" id="preview-name"></span>
      <button type="button" class="preview-close" id="preview-close" aria-label="关闭">×</button>
    </div>
    <div class="preview-body" id="preview-body"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
